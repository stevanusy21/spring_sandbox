server:
    port: 8080

spring:
    application:
        name: gateway-service
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                    - id: auth-service-route
                      uri: http://localhost:8081
                      predicates:
                        - Path=/api/auth/**, /v1/api-docs/auth-service/**

                    - id: user-service-route
                      uri: http://localhost:8082
                      predicates:
                        - Path=/api/users/**, /v1/api-docs/user-service/**

springdoc:
    swagger-ui:
        path: /swagger-ui/index.html
        urls:
            - name: User service
              url: /v1/api-docs/user-service
